name: tests

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/lint@v2

  test:
    needs: [linting]
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Early development: one Python version on Linux only. The wider matrix (all supported
        # Python versions, macOS and Windows) comes back before the first non-preview release.
        python-version: ["3.12"]
        os: [ubuntu-latest]
        # The GUI tests need a display; the NIU test action reads this flag from the matrix.
        use-xvfb: [true]
        # include:
        # - os: macos-latest
        #   python-version: "3.13"
        # - os: windows-latest
        #   python-version: "3.13"

    steps:
      # Run tests
      - uses: neuroinformatics-unit/actions/test@v2
        with:
          python-version: ${{ matrix.python-version }}
          use-xvfb: ${{ matrix.use-xvfb }}

  build_sdist_wheels:
    name: Build source distribution
    needs: [test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/build_sdist_wheels@v2


  upload_all:
    name: Publish build distributions
    needs: [build_sdist_wheels]
    runs-on: ubuntu-latest
    environment: # use Trusted Publisher route
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: artifact
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
